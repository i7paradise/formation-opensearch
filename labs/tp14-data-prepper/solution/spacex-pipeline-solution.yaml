spacex-pipeline:
  source:
    http:
      port: 2021
  buffer:
    bounded_blocking:
      buffer_size: 1024
      batch_size: 256
  processor:
    - drop_events:
        drop_when: '/success == false'
    - date:
        from_time_received: false
        destination: "@timestamp"
        match:
          - key: "date_utc"
            patterns: ["yyyy-MM-dd'T'HH:mm:ss.SSSXXX", "yyyy-MM-dd'T'HH:mm:ssXXX", "ISO8601"]
    - mutate:
        entries:
          - key: source
            value: "spacex-api"
            add_to_existing_only: false
          - key: ingested_by
            value: "data-prepper"
            add_to_existing_only: false
  sink:
    - opensearch:
        hosts: ["https://opensearch-node1:9200"]
        index: "spacex-launches"
        username: "admin"
        password: "Admin@1234!"
        insecure: true
        bulk_size: 100
