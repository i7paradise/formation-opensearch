name: Deploy to Public Repo

on:
  push:
    branches: [master]
    paths:
      - "opensearch-formation/slides/**"
      - "opensearch-formation/labs/**"
      - "opensearch-formation/infrastructure/**"
      - "opensearch-formation/data/**"
      - "opensearch-formation/index.html"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (private)
        uses: actions/checkout@v4

      - name: Clone target (public)
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/i7paradise/formation-opensearch.git /tmp/public-repo

      - name: Sync selected content
        run: |
          SRC="opensearch-formation"
          DST="/tmp/public-repo"

          # Clear previously synced folders so deletions propagate
          rm -rf \
            "$DST/slides" \
            "$DST/labs" \
            "$DST/infrastructure" \
            "$DST/data" \
            "$DST/index.html"

          # Copy selected content
          cp -r "$SRC/slides"          "$DST/slides"
          cp -r "$SRC/labs"            "$DST/labs"
          cp -r "$SRC/infrastructure"  "$DST/infrastructure"
          cp -r "$SRC/data"            "$DST/data"
          cp    "$SRC/index.html"      "$DST/index.html"

      - name: Commit and push
        run: |
          cd /tmp/public-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit — public repo is already up to date."
          else
            COMMIT_SHA="${{ github.sha }}"
            git commit -m "sync: update from private repo @ ${COMMIT_SHA::7}"
            git push
          fi
